[project]
name = "lilywrites"
version = "0.1.0"
description = "Tools to convert a directory of markdown files into a static website."
readme = "README.md"
authors = [
    { name = "Lily Richards", email = "lilymichellerichards@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandoc>=2.4",
]

[project.scripts]
lilywrites = "lilywrites:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
